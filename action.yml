name: "Graph-Code Blast Radius"
description: >
  Comments what actually depends on the code a PR changes, found by traversing the
  real call/import graph (Tree-sitter parsed) rather than text search — so it catches
  a caller that never mentions the changed symbol's name in its own diff.
author: "Adrija Dhar"
branding:
  icon: "git-pull-request"
  color: "blue"

inputs:
  direction:
    description: "upstream (who depends on it) | downstream (what it depends on) | both"
    required: false
    default: "upstream"
  app-client-id:
    description: >
      Optional: the Client ID of a GitHub App installed on this repo, so the comment
      posts under that App's own name/avatar instead of the generic
      github-actions[bot] identity. Needs app-private-key too. Omit both to just use
      the default token (works with zero setup, looks like any other CI check's
      comment).
    required: false
    default: ""
  app-private-key:
    description: "Private key for app-client-id, as a repo secret — required if app-client-id is set."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # Installs the graphcode *package* from its own repo, not the caller's — a
    # composite action's steps run inside the calling workflow's checkout, which is
    # someone else's repo, not graph-code itself.
    - run: pip install "graphcode @ git+https://github.com/AdrijaDhar/graph-code.git"
      shell: bash
    - uses: actions/create-github-app-token@v3
      id: app_token
      if: inputs.app-client-id != ''
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
    - run: >
        graphcode pr-comment
        --repo "$GITHUB_WORKSPACE"
        --base "origin/${{ github.base_ref }}"
        --head HEAD
        --direction "${{ inputs.direction }}"
        --post
      shell: bash
      env:
        # Falls back to github.token (the default GITHUB_TOKEN, already scoped by the
        # calling workflow's own `permissions:` block) when app-client-id isn't set —
        # the app_token step above didn't run, so its output is empty and this just
        # uses the default. Nothing extra for a consumer to configure unless they want
        # the custom-identity upgrade.
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
