[project]
name = "graphcode"
version = "0.1.0"
description = "AST-to-graph copilot infrastructure: Tree-sitter, Memgraph, MCP, SaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.23.0",
  "tree-sitter-python>=0.23.0",
  "tree-sitter-javascript>=0.23.0",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-java>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-c>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "neo4j>=5.20.0",
  "pathspec>=0.12.0",
  "mcp>=1.2.0,<2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "python-dotenv>=1.0.0",
  "watchdog>=4.0.0",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
rocks = ["rocksdict>=0.3.0"]
embed = ["fastembed>=0.4.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
graphcode = "graphcode.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
