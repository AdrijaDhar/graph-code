name: blast-radius-comment
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — `graphcode pr-comment` diffs
          # against the base ref by name (origin/<base>), which needs it to exist
          # locally, and co-change/blast-radius resolution needs real repo structure.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installs the graphcode *package* from its own repo, regardless of which repo
      # this workflow is running in — `pip install -e .` would instead try to install
      # whatever repo checked out this workflow as if it were graph-code itself, which
      # only happens to work by coincidence when testing this on graph-code's own PRs.
      # Any other repo adopting this file needs graphcode installed as a dependency,
      # not assumed to be the current checkout.
      - run: pip install "graphcode @ git+https://github.com/AdrijaDhar/graph-code.git"
      # Posts as the "graph-code" GitHub App (its own name + avatar) instead of the
      # generic github-actions[bot] identity every default-token comment gets —
      # otherwise indistinguishable from any other CI check in a PR's comment feed.
      # Needs the App installed on this repo and its Client ID/private key as secrets
      # (Settings -> Secrets and variables -> Actions): CLIENT_ID, APP_PRIVATE_KEY.
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - run: >
          graphcode pr-comment
          --repo .
          --base origin/${{ github.base_ref }}
          --head HEAD
          --post
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
